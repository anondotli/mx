services:
  haraka:
    build: .
    restart: unless-stopped
    ports:
      - "25:25"
    # Haraka runs as the unprivileged haraka user and must bind port 25.
    # Docker already defaults to this; state it so other runtimes behave alike.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    environment:
      - NODE_ENV=production
      - MAIL_API_SECRET=${MAIL_API_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      # Same value as the website's; decrypts custom-domain DKIM keys
      - DKIM_ENCRYPTION_KEY=${DKIM_ENCRYPTION_KEY}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - DKIM_SOURCE_DIR=/etc/haraka/config/dkim-src
      - LOCAL_DKIM_DIR=/run/haraka/dkim
      # Increase Node memory for crypto ops
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      # Runtime-managed secrets and queue state
      - ./config/dkim:/etc/haraka/config/dkim-src:ro
      - ./config/tls:/etc/haraka/config/tls-src:ro
      - haraka-queue:/etc/haraka/queue
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    # The log names every sender and alias. Docker's default json-file driver
    # never rotates it; keep a bounded window instead (compressed).
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "printf 'EHLO healthcheck\\r\\nQUIT\\r\\n' | nc -w5 localhost 25 | grep -q '250'"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      default: {}

volumes:
  haraka-queue:

networks:
  default:
    enable_ipv6: true
