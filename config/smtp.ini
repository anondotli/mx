[main]
; Inbound MX on all IPv6 and IPv4 addresses. (No submission port: the server
; has no SMTP AUTH and only receives mail for aliases.)
listen = [::0]:25
nodes = 0

; Our public IPv4 (mx.anon.li), for outbound's loop check. Without it Haraka
; looks the address up over STUN, which the image does not install (see the
; Dockerfile), and logs a warning at the first delivery.
public_ip = 192.129.190.171

; Message size and header settings live in connection.ini ([max] bytes,
; [headers]) since Haraka 3.
