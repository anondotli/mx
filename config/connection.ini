; This file replaces Haraka's default connection.ini as a whole (keys are not
; merged), so every setting Haraka reads is listed here.
; (The listen address and inactivity timeout are in smtp.ini.)

[main]
strict_rfc1869 = false
smtputf8 = true

[haproxy]
hosts[] =

[headers]
add_received = true
clean_auth_results = true
; Don't advertise the Haraka version in Received headers
show_version = false
max_lines = 1000
max_received = 100

[max]
; Maximum message size (25 MiB). Without it Haraka accepts any size, and
; forwarding buffers whole messages in memory.
bytes = 26214400
mime_parts = 1000
line_length = 512
data_line_length = 992

[message]
greeting[] = anon.li Alias is ready
helo = Haraka is at your service.
close = closing connection. Have a jolly good day.

[uuid]
banner_chars = 76
deny_chars = 32
