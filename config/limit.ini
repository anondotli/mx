[main]
# Rate limiting settings (used by limit-upstash.js)
# 20 connections per 60 seconds per IP (IPv6: per /64)
rate_limit_window = 60
rate_limit_count = 20

# Rejected recipients allowed per connection before it is dropped (used by
# limit-upstash.js; each RCPT is a database lookup)
max_rejected_rcpts = 10

# Per-alias rate limiting (used by rcpt_to.anonli.js)
# 50 emails per 300 seconds per alias
alias_rate_limit_window = 300
alias_rate_limit_count = 50

# New catch-all aliases per domain (used by rcpt_to.anonli.js); mail for
# further new addresses is tempfailed and retried by the sender
# 30 new aliases per 3600 seconds per domain
catch_all_rate_limit_window = 3600
catch_all_rate_limit_count = 30
